name: Verify

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "22.19.0"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run typecheck
      - run: vp test
      - run: vp build
      - run: docker build --check -f apps/backend/Dockerfile .
