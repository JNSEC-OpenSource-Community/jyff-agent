name: Verify

on:
  # PR 由 pull_request 校验；仅在合并到 main 后再运行一次 push 校验，
  # 避免功能分支的 push 和 PR 事件重复执行同一套检查。
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "22.19.0"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run typecheck
      - run: vp test
      - run: vp build
      - run: docker build --check -f apps/backend/Dockerfile .
