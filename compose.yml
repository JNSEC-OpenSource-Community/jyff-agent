services:
  webui:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    image: ctf-agent-webui:latest
    init: true
    command:
      - --root
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --challenge-timeout-ms
      - "${CTF_AGENT_CHALLENGE_TIMEOUT_MS:-1800000}"
      - --max-session-interruptions
      - "${CTF_AGENT_MAX_SESSION_INTERRUPTIONS:-3}"
      - --auth-file
      - /auth.json
      - --workspace-volume
      - ctf-agent-data
    environment:
      NODE_ENV: production
      # Lets short-lived audit containers mount only the shared data volume.
      CONTAINER_ENV: docker
      CTF_AGENT_DATA_VOLUME: ctf-agent-data
      PI_OAUTH_CALLBACK_HOST: 0.0.0.0
    ports:
      - "0.0.0.0:${CTF_AGENT_WEBUI_PORT:-3000}:3000"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:53692:53692"
    volumes:
      - ctf-agent-data:/data/.ctf-agent
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # 可选：默认只启动 WebUI，不会读取或构建外部 ShellPoop 仓库。
  # 启用方式：docker compose --profile shellpoop up --build -d
  shellpoop:
    profiles: ["shellpoop"]
    build:
      context: ${SHELLPOOP_BUILD_CONTEXT:-../shellpoop}
    image: shellpoop:latest
    init: true
    environment:
      SHELLPOOP_HOST: 0.0.0.0
      SHELLPOOP_PORT: "8000"
      SHELLPOOP_LISTEN_HOST: 0.0.0.0
      SHELLPOOP_PORT_MIN: "20000"
      SHELLPOOP_PORT_MAX: "21000"
      # 目标主机回连的对外 IP/域名；公网/NAT 场景请显式设置。
      SHELLPOOP_ADVERTISE_HOST: "${SHELLPOOP_ADVERTISE_HOST:-}"
    ports:
      # REST API：webui 容器经 compose 网络访问 shellpoop:8000；宿主机也可直接访问。
      - "127.0.0.1:8000:8000"
      # 反弹 shell 监听端口池：目标主机据此回连（需防火墙放行）。
      - "0.0.0.0:20000-21000:20000-21000"
    restart: unless-stopped

volumes:
  ctf-agent-data:
    name: ctf-agent-data
