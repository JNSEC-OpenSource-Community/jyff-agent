services:
  webui:
    build:
      context: .
      dockerfile: packages/webui/Dockerfile
    image: ctf-agent-webui:latest
    environment:
      CTF_WEBUI_HOST: 0.0.0.0
      CTF_WEBUI_PORT: 3000
      CTF_WEBUI_POLL_INTERVAL_MS: 1000
      CTF_DOCKER_WORKSPACE_VOLUME: ctf-agent-data
      CTF_TELEMETRY_LEVEL: ${CTF_TELEMETRY_LEVEL:-full}
      CTF_TELEMETRY_MAX_TEXT_LENGTH: ${CTF_TELEMETRY_MAX_TEXT_LENGTH:-8000}
      CTF_SCHEDULER_AUTO_START: ${CTF_SCHEDULER_AUTO_START:-false}
      CTF_SCHEDULER_MAX_CONCURRENT: ${CTF_SCHEDULER_MAX_CONCURRENT:-2}
      CTF_SCHEDULER_MAX_ATTEMPTS: ${CTF_SCHEDULER_MAX_ATTEMPTS:-2}
      CTF_SCHEDULER_TIMEOUT_MS: ${CTF_SCHEDULER_TIMEOUT_MS:-1800000}
      CTF_SCHEDULER_RETRY_DELAY_MS: ${CTF_SCHEDULER_RETRY_DELAY_MS:-2000}
      CTF_MODEL_API_KEY: ${CTF_MODEL_API_KEY:-}
      CTF_MODEL_ID: ${CTF_MODEL_ID:-}
      CTF_MODEL_PROVIDER: ${CTF_MODEL_PROVIDER:-openrouter}
      CTF_MODEL_BASE_URL: ${CTF_MODEL_BASE_URL:-}
      CTF_MODEL_CONTEXT_WINDOW: ${CTF_MODEL_CONTEXT_WINDOW:-64000}
      CTF_MODEL_MAX_TOKENS: ${CTF_MODEL_MAX_TOKENS:-4096}
    ports:
      - "127.0.0.1:${CTF_WEBUI_PORT:-3000}:3000"
    volumes:
      - ctf-agent-data:/app/examples/mock-ctf/.ctf-agent
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  ctf-agent-data:
    name: ctf-agent-data
