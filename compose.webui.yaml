services:
  webui:
    build:
      context: .
      dockerfile: packages/webui/Dockerfile
    image: ctf-agent-webui:latest
    command:
      - --root
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --challenge-timeout-ms
      - "${CTF_AGENT_CHALLENGE_TIMEOUT_MS:-1800000}"
      - --max-session-interruptions
      - "${CTF_AGENT_MAX_SESSION_INTERRUPTIONS:-3}"
      - --auth-file
      - /auth.json
      - --workspace-volume
      - ctf-agent-data
    ports:
      - "127.0.0.1:${CTF_AGENT_WEBUI_PORT:-3000}:3000"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:53692:53692"
    environment:
      PI_OAUTH_CALLBACK_HOST: 0.0.0.0
    volumes:
      - ctf-agent-data:/data/.ctf-agent
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  ctf-agent-data:
    name: ctf-agent-data
